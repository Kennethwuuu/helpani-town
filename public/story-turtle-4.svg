<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    .hatchling { animation: hatchling 2.9s ease-out both; }
    .window { animation: dim 2.2s ease-out both; }
    .foam { animation: wash 3.2s ease-in-out both; }
    @keyframes hatchling { 0% { transform: translate(-14px, 11px); } 42% { transform: translate(-10px, 8px); } 60% { transform: translate(-4px, 6px); } }
    @keyframes dim { 0%, 20% { fill: #af9564; } 100% { fill: #263c40; } }
    @keyframes wash { 48% { opacity: .89; } }
    @media (prefers-reduced-motion: reduce) { .hatchling, .window, .foam { animation: none; } }
  </style>
