<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    .grass { transform-box: fill-box; transform-origin: bottom center; animation: sway 3s ease-in-out both; }
    .turtle { animation: graze 2.8s ease-in-out both; }
    .bubbles { animation: bubble-rise 2.3s ease-out .15s both; }
    @keyframes sway { 28% { transform: skewX(6deg); } 67% { transform: skewX(-4deg); } }
    @keyframes graze { 58% { transform: translate(10px, 5px); } }
    @keyframes bubble-rise { from { transform: translateY(9px); opacity: .15; } 70% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { .grass, .turtle, .bubbles { animation: none; } }
  </style>
  <defs>
    <pattern id="grain" width="28" height="21" patternUnits="userSpaceOnUse">
      <path d="M3 4h1m15 4h1m-8 9h1m-9 1h1m19-3h1" stroke="#fbefc0" stroke-width=".8" opacity=".55"/>
    </pattern>
